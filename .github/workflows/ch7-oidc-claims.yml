# Chapter 7 bonus (Chapter 9 prep): mint a GitHub Actions OIDC token and print
# its claims. The claims are not secret; the token itself is masked and never
# printed. In Chapter 9 the OCI side trusts tokens whose claims match a policy.
name: ch7-oidc-claims

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job request an OIDC token

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Request token and decode its claims
        env:
          AUDIENCE: chapter7-lab
        run: |
          set -euo pipefail
          TOKEN=$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r '.value')
          echo "::add-mask::${TOKEN}"
          PAYLOAD=$(echo "${TOKEN}" | cut -d '.' -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "${PAYLOAD}" | base64 -d | jq '{iss, aud, sub, repository, repository_owner, ref, environment, workflow_ref, event_name, iat, exp}'
