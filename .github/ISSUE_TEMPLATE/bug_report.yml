name: Bug Report
description: Report a bug to help us improve the project
title: "[Bug]: "
labels: ["bug", "triage"]
# assignees: ["your-github-username"]   # optional: auto-assign someone

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!
        Please fill in the fields below so we can reproduce and fix the issue quickly.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I do X, I expected Y, but Z happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps someone can follow to see the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did this happen?
      options:
        - Production
        - Staging
        - Development
        - Local
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version / commit were you running?
      placeholder: e.g. 1.4.2 or commit abc1234
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant logs or error messages. This is automatically formatted as code, so no backticks needed.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues and this bug has not already been reported.
          required: true
        - label: I have provided enough information to reproduce the problem.
          required: true
